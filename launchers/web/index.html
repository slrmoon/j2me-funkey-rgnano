<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>phoneME Web</title>
<style>
  :root {
    --bg: #101214; --panel: #1b1e22; --fg: #e4e6e8; --muted: #8b9198;
    --accent: #e0b040; --line: #2c3036;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f3f4f5; --panel: #ffffff; --fg: #1d2024; --muted: #5d636a;
      --accent: #a87a10; --line: #d9dce0;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 4px 0 12px; font-weight: 600; }
  h1 span { color: var(--muted); font-weight: 400; }
  #stage { position: relative; width: 100%; aspect-ratio: 1; background: #000;
           border-radius: 6px; overflow: hidden; max-height: 85vh; margin: 0 auto; }
  #stage:fullscreen { max-height: none; border-radius: 0; aspect-ratio: auto; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain;
           image-rendering: pixelated; outline: none; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column;
             align-items: center; justify-content: center; gap: 14px; padding: 16px;
             background: var(--panel); text-align: center; }
  #overlay.drag { outline: 3px dashed var(--accent); outline-offset: -10px; }
  button, .file { font: inherit; padding: 10px 18px; border-radius: 6px; cursor: pointer;
                  border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #111;
                   font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .file input { display: none; }
  #picked { color: var(--muted); min-height: 1.4em; overflow-wrap: anywhere; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #bar { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  #status { color: var(--muted); flex: 1; min-width: 150px; }
  #bar button { padding: 6px 12px; }
  details { margin-top: 14px; color: var(--muted); }
  summary { cursor: pointer; }
  #log { white-space: pre-wrap; font: 12px/1.35 ui-monospace, monospace;
         max-height: 30vh; overflow: auto; margin-top: 8px; }
  .keys { margin-top: 14px; color: var(--muted); font-size: 13px; }
  kbd { border: 1px solid var(--line); border-radius: 3px; padding: 0 4px;
        font: 12px ui-monospace, monospace; color: var(--fg); }
</style>
</head>
<body>
<main>
<h1>phoneME <span>J2ME in the browser · prototype</span></h1>
<div id="stage">
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <div id="overlay">
    <div>Open a J2ME game (.jar) or an i-appli (.jar + .jam, and its .sp
      if you have one) — the files stay on this computer.</div>
    <div class="row">
      <label class="file">Choose game<input id="file" type="file" accept=".jar,.jam,.sp" multiple></label>
      <button id="demo">MotherLoad (demo)</button>
    </div>
    <div id="picked"></div>
    <button id="start" class="primary" disabled>Start</button>
  </div>
</div>
<div id="bar">
  <div id="status">No game loaded</div>
  <button id="full" disabled>Full screen</button>
  <button id="reload">Another game</button>
</div>
<div class="keys">
  <kbd>←↑→↓</kbd> move · <kbd>Enter</kbd>/<kbd>Space</kbd> fire ·
  <kbd>F1</kbd> <kbd>F2</kbd> soft keys · <kbd>0</kbd>–<kbd>9</kbd> keypad ·
  <kbd>Esc</kbd> runtime menu. Saves are kept in this browser.
</div>
<details><summary>Log</summary><div id="log"></div></details>
</main>
<script>
// Launcher page of the browser build. Picks a jar (file, drop, or ?jar=),
// reads the MIDlet class from its manifest, and starts runMidlet.js after a
// click (browsers allow sound only after one). Record stores live in
// IndexedDB, one folder per game.
const params = new URLSearchParams(location.search);
// build id (scripts/build-web.sh): a new build is never mixed with cached files
const V = '?v=__BUILD__';
const $ = id => document.getElementById(id);
const logEl = $('log');
function log(s) { logEl.textContent += s + '\n'; logEl.scrollTop = 1e9; console.log(s); }
function status(s) { $('status').textContent = s; }

let game = null;   // { name, bytes, main }

// --- the MIDlet class: MIDlet-1 in META-INF/MANIFEST.MF -------------------
async function readManifest(bytes) {
  const v = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let eocd = -1;
  for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {
    if (v.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('not a zip/jar file');
  let p = v.getUint32(eocd + 16, true);
  const count = v.getUint16(eocd + 10, true);
  for (let n = 0; n < count; n++) {
    const method = v.getUint16(p + 10, true), csize = v.getUint32(p + 20, true);
    const nlen = v.getUint16(p + 28, true), xlen = v.getUint16(p + 30, true);
    const clen = v.getUint16(p + 32, true), local = v.getUint32(p + 42, true);
    const name = new TextDecoder().decode(bytes.subarray(p + 46, p + 46 + nlen));
    p += 46 + nlen + xlen + clen;
    if (name.toUpperCase() !== 'META-INF/MANIFEST.MF') continue;
    const start = local + 30 + v.getUint16(local + 26, true) + v.getUint16(local + 28, true);
    const data = bytes.subarray(start, start + csize);
    if (method === 0) return new TextDecoder().decode(data);
    const out = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return await new Response(out).text();
  }
  throw new Error('no META-INF/MANIFEST.MF in the jar');
}

function manifestValue(text, key) {
  const lines = text.replace(/\r/g, '').split('\n');
  for (let i = 0; i < lines.length; i++) {
    if (lines[i].toLowerCase().startsWith(key.toLowerCase() + ':')) {
      let v = lines[i].slice(key.length + 1);
      while (i + 1 < lines.length && lines[i + 1].startsWith(' ')) v += lines[++i].slice(1);
      return v.trim();
    }
  }
  return null;
}

// i-appli (DoJa) descriptor: "Key = Value" lines in Shift_JIS
function jamValues(bytes) {
  let text;
  try { text = new TextDecoder('shift_jis').decode(bytes); }
  catch (e) { text = new TextDecoder().decode(bytes); }
  const out = {};
  for (const line of text.split(/\r?\n/)) {
    const i = line.indexOf('=');
    if (i > 0) out[line.slice(0, i).trim()] = line.slice(i + 1).trim();
  }
  return out;
}

// files picked or dropped so far (a DoJa game is two or three files)
const chosen = { jar: null, jam: null, sp: null };

async function pick(files) {
  for (const f of files) {
    const ext = f.name.toLowerCase().split('.').pop();
    if (ext === 'jar' || ext === 'jam' || ext === 'sp') chosen[ext] = f;
  }
  game = null;
  $('start').disabled = true;
  const jar = chosen.jar;
  if (!jar) { $('picked').textContent = chosen.jam ? chosen.jam.name + ': now the .jar' : ''; return; }
  const bytes = jar.bytes;
  let main = params.get('main'), mf = '';
  try {
    mf = await readManifest(bytes);
  } catch (e) {
    $('picked').textContent = jar.name + ': ' + e.message;
    return;
  }
  const m1 = manifestValue(mf, 'MIDlet-1');
  if (!main && m1) main = (m1.split(',')[2] || '').trim();
  const name = jar.name.replace(/\.jar$/i, '');
  if (chosen.jam || !main) {
    if (!chosen.jam) {
      $('picked').textContent = jar.name + ': no MIDlet-1 — if it is an i-appli, add its .jam';
      return;
    }
    const jam = jamValues(chosen.jam.bytes);
    if (!jam.AppClass) { $('picked').textContent = chosen.jam.name + ': no AppClass'; return; }
    const ascii = v => /^[\x20-\x7e]*$/.test(v || '') ? (v || '') : '';
    game = { name, bytes, jad: '', main: jam.AppClass, doja: {
      jam: chosen.jam.bytes, cls: jam.AppClass,
      area: /^\d+x\d+$/.test(jam.DrawArea || '') ? jam.DrawArea : '240x240',
      param: ascii(jam.AppParam), ver: ascii(jam.AppVer), spsize: ascii(jam.SPsize),
      sp: chosen.sp ? chosen.sp.bytes : null } };
    $('picked').textContent = jar.name + ' + ' + chosen.jam.name +
      (chosen.sp ? ' + ' + chosen.sp.name : '') + ' — i-appli ' + jam.AppClass;
  } else {
    game = { name, bytes, main, jad: mf };
    $('picked').textContent = jar.name + ' — ' + main;
  }
  $('start').disabled = false;
  $('start').focus();
  status('Ready: ' + game.name);
}

async function readFiles(list) {
  const out = [];
  for (const f of list) out.push({ name: f.name, bytes: new Uint8Array(await f.arrayBuffer()) });
  return out;
}

$('file').addEventListener('change', async e => {
  pick(await readFiles(e.target.files));
  e.target.value = '';
});
const ov = $('overlay');
ov.addEventListener('dragover', e => { e.preventDefault(); ov.classList.add('drag'); });
ov.addEventListener('dragleave', () => ov.classList.remove('drag'));
ov.addEventListener('drop', async e => {
  e.preventDefault(); ov.classList.remove('drag');
  pick(await readFiles(e.dataTransfer.files));
});
async function fetchJar(url) {
  status('Loading ' + url + '…');
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + ': HTTP ' + r.status);
  await pick([{ name: url.split('/').pop(), bytes: new Uint8Array(await r.arrayBuffer()) }]);
}
$('demo').addEventListener('click', () => fetchJar('MotherLoad.jar').catch(e => status(e.message)));
if (params.get('jar')) fetchJar(params.get('jar')).catch(e => status(e.message));

$('reload').addEventListener('click', () => location.href = location.pathname);

// --- start again: the runtime cannot run twice in one page, so the game is
// kept in IndexedDB and the page reloads with ?restart=1
function stashDb() {
  return new Promise((ok, fail) => {
    const r = indexedDB.open('phoneme-web', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('stash');
    r.onsuccess = () => ok(r.result);
    r.onerror = () => fail(r.error);
  });
}
async function stash(value) {
  const db = await stashDb();
  await new Promise((ok, fail) => {
    const t = db.transaction('stash', 'readwrite');
    if (value) t.objectStore('stash').put(value, 'game');
    else t.objectStore('stash').delete('game');
    t.oncomplete = ok; t.onerror = () => fail(t.error);
  });
}
async function unstash() {
  const db = await stashDb();
  return new Promise(ok => {
    const r = db.transaction('stash').objectStore('stash').get('game');
    r.onsuccess = () => ok(r.result); r.onerror = () => ok(null);
  });
}
async function startAgain(auto) {
  await stash(Object.assign({}, game, { auto }));
  location.href = location.pathname + '?restart=1' + (params.get('fps') ? '&fps=1' : '');
}
if (params.get('restart')) {
  unstash().then(async g => {
    await stash(null);
    if (!g) return;
    const auto = g.auto;
    delete g.auto;
    game = g;
    $('picked').textContent = g.name + '.jar — ' + g.main;
    $('start').disabled = false;
    status('Ready: ' + g.name);
    if (auto) $('start').click();
  }).catch(e => log('cannot restart: ' + e));
}

// browsers keep sound off until a key or click: resume it on the first one
function resumeAudio() {
  try {
    if (typeof SDL !== 'undefined' && SDL.audioContext && SDL.audioContext.state === 'suspended') {
      SDL.audioContext.resume();
    }
  } catch (e) {}
}
document.addEventListener('keydown', resumeAudio);
document.addEventListener('pointerdown', resumeAudio);
$('full').addEventListener('click', () => $('stage').requestFullscreen && $('stage').requestFullscreen());

// --- the runtime ---------------------------------------------------------
function loadScript(src) {
  return new Promise((ok, fail) => {
    const s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = () => fail(new Error('cannot load ' + src));
    document.body.appendChild(s);
  });
}

// KEY=VALUE file of the runtime menu -> {KEY: VALUE}
function readCfg(path) {
  const out = {};
  try {
    for (const line of FS.readFile(path, { encoding: 'utf8' }).split('\n')) {
      const i = line.indexOf('=');
      if (i > 0) out[line.slice(0, i).trim()] = line.slice(i + 1).trim();
    }
  } catch (e) {}
  return out;
}

// the settings the runtime menu saved, as the FunKey launcher passes them
function applyRuntimeCfg(gameCfg) {
  const d = readCfg('/cfg/debug.cfg');
  const debugEnv = { KEYS: 'PHONEME_KEY_DEBUG', EVENTS: 'PHONEME_EVENT_DEBUG',
    DISPLAY: 'PHONEME_DISPLAY_DEBUG', AUDIO: 'PHONEME_AUDIO_TRACE', FPS: 'PHONEME_SHOW_FPS' };
  for (const k in debugEnv) {
    if (d[k] === '1') ENV[debugEnv[k]] = '1'; else delete ENV[debugEnv[k]];
  }
  const g = readCfg(gameCfg);
  if (g.DISPLAY_MODE) ENV.PHONEME_SCALE_MODE = g.DISPLAY_MODE;
  if (g.FILTER) ENV.PHONEME_SCALE_FILTER = g.FILTER;
  if (g.FPS_LIMIT) ENV.PHONEME_FPS_LIMIT = g.FPS_LIMIT;
  if (g.VOLUME) ENV.PHONEME_SOUND_VOLUME = g.VOLUME;
  if (g.SYNTH) ENV.PHONEME_SYNTH = g.SYNTH;
  const z = /^zoom-(\d+)$/.exec(g.SCALE || '');   // zoom-150 = 150%, zoom-1875 = 187.5%
  if (z) ENV.PHONEME_SCALE_RATIO = String(z[1].length <= 3 ? Number(z[1]) * 10 : Number(z[1]));
  if (g.PAN_X !== undefined) ENV.PHONEME_PAN = g.PAN_X + ',' + (g.PAN_Y || '0');
  if (!params.get('lcd')) {
    if (g.VIEW === 'full') { ENV.PHONEME_SOURCE_SIZE = 'full'; }
    else if (/^\d+x\d+$/.test(g.VIEW || '')) { ENV.PHONEME_SOURCE_SIZE = g.VIEW; ENV.PHONEME_LCD_SIZE = g.VIEW; }
  }
}

let syncing = false;
function saveRms() {
  if (syncing || typeof FS === 'undefined') return;
  syncing = true;
  FS.syncfs(false, err => { syncing = false; if (err) log('saving failed: ' + err); });
}

// size of the game area in device pixels
function stagePixels() {
  const r = $('stage').getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const k = Math.min(1, 2048 / Math.max(r.width * dpr, r.height * dpr));
  return [Math.max(120, Math.round(r.width * dpr * k)), Math.max(120, Math.round(r.height * dpr * k))];
}
let resizeTimer = 0;
function stageResized() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (window.Module && Module._fk_web_resize) Module._fk_web_resize(...stagePixels());
  }, 100);
}
window.addEventListener('resize', stageResized);
document.addEventListener('fullscreenchange', stageResized);
// F11 / Alt+Enter: the page's full screen (the runtime's own switch is for
// a desktop window); taken before the runtime sees the key
window.addEventListener('keydown', e => {
  if (e.key === 'F11' || (e.key === 'Enter' && e.altKey)) {
    e.preventDefault();
    e.stopImmediatePropagation();
    if (document.fullscreenElement) document.exitFullscreen();
    else if ($('stage').requestFullscreen) $('stage').requestFullscreen();
  }
}, true);

// the command line of an i-appli (as launchers/linux/run.sh)
function dojaArgs(spPath) {
  const d = game.doja;
  const hex = Array.from(d.jam, b => b.toString(16).padStart(2, '0')).join('');
  return ['-UseVerifier', '=MaxMethodToCompile3000',
    '-Ddoja.app.class=' + d.cls, '-Ddoja.app.param=' + d.param, '-Ddoja.app.ver=' + d.ver,
    '-Dmicroedition.encoding=SJIS', '-Ddoja.scratchpad.path=' + spPath,
    ...(params.get('trace') ? ['-Ddoja.trace=1'] : []),
    '-Ddoja.spsize=' + d.spsize, '-Ddoja.jam.hex=' + hex, '-Ddoja.pictures=',
    '-classpathext', '/game/game.jar:/midp/lib/doja-support.jar',
    'internal', 'com.funkey.doja.DoJaMIDlet'];
}

let started = false;
$('start').addEventListener('click', async () => {
  if (!game) return;
  if (started) { startAgain(true); return; }   // after the game ended
  started = true;
  $('start').disabled = true;
  const lcd = /^(\d+)x(\d+)$/.exec(params.get('lcd') || (game.doja ? game.doja.area : '240x240'));
  if (lcd) $('stage').style.aspectRatio = lcd[1] + ' / ' + lcd[2];
  status('Starting ' + game.name + '…');
  const rmsDir = '/rms/' + game.name.replace(/[^A-Za-z0-9_.-]/g, '_');
  window.Module = {
    locateFile: path => path + V,   // midp-files.data
    canvas: $('canvas'),
    arguments: game.doja ? dojaArgs(rmsDir + '/game.sp')
                         : ['-UseVerifier', '-classpathext', '/game/game.jar', 'internal', game.main],
    print: log,
    printErr: log,
    setStatus: s => s && status(s),
    preRun: [function () {
      FS.mkdir('/game');
      FS.writeFile('/game/game.jar', game.bytes);
      // getAppProperty() reads a .jad next to the jar: made from the
      // manifest, as the other launchers do
      if (!game.doja) FS.writeFile('/game/game.jad', game.jad);
      FS.mkdir('/rms');
      FS.mkdir(rmsDir);
      FS.mount(IDBFS, {}, rmsDir);
      // the runtime menu's files, as on the FunKey: debug switches of all
      // games and this game's display/sound choices (kept in IndexedDB)
      FS.mkdir('/cfg');
      FS.mount(IDBFS, {}, '/cfg');
      const gameCfg = '/cfg/' + rmsDir.slice(5) + '.cfg';
      Object.assign(ENV, {
        MIDP_HOME: '/midp',
        PHONEME_RMS_HOME: rmsDir,
        PHONEME_HEAP_MB: params.get('heap') || (game.doja ? '32' : '16'),
        PHONEME_LCD_SIZE: params.get('lcd') || (game.doja ? game.doja.area : '240x240'),
        PHONEME_ENABLE_AUDIO: '1',
        PHONEME_RESTART_FLAG: '/tmp/restart-request',
        PHONEME_DEBUG_CONFIG: '/cfg/debug.cfg',
        PHONEME_CONFIG_PATH: gameCfg,
        // desktop presenter: the game drawn straight at the size of the
        // page's game area in device pixels (filters, fit/integer modes)
        PHONEME_WINDOW_SIZE: stagePixels().join('x'),
      });
      Module.addRunDependency('saves');
      FS.syncfs(true, err => {
        if (err) log('cannot read saves: ' + err);
        applyRuntimeCfg(gameCfg);
        if (game.doja) {
          // i-appli: the screen is the .jam DrawArea; the scratchpad lives
          // with the saves (the picked .sp only the first time)
          if (!params.get('lcd') && !ENV.PHONEME_SOURCE_SIZE) ENV.PHONEME_SOURCE_SIZE = game.doja.area;
          const sp = rmsDir + '/game.sp';
          if (!FS.analyzePath(sp).exists) FS.writeFile(sp, game.doja.sp || new Uint8Array(0));
        }
        if (params.get('fps')) ENV.PHONEME_SHOW_FPS = '1';
        if (params.get('limit')) ENV.PHONEME_FPS_LIMIT = params.get('limit');
        // ?env=NAME=value (repeatable): any runtime setting, for testing
        for (const e of params.getAll('env')) {
          const i = e.indexOf('=');
          if (i > 0) ENV[e.slice(0, i)] = e.slice(i + 1);
        }
        Module.removeRunDependency('saves');
      });
    }],
    onRuntimeInitialized() {
      ov.style.display = 'none';
      $('full').disabled = false;
      $('canvas').focus();
      status('Running ' + game.name);
      setInterval(saveRms, 3000);
      document.addEventListener('visibilitychange', saveRms);
      window.addEventListener('pagehide', saveRms);
    },
    // runMidlet returned: Exit or "Restart game" in the runtime menu
    fkGameEnded(code) {
      saveRms();
      let restart = false;
      try { restart = FS.analyzePath('/tmp/restart-request').exists; } catch (e) {}
      if (restart) {
        status('Restarting ' + game.name + '…');
        setTimeout(() => startAgain(true), 300);   // let the saves reach IndexedDB
        return;
      }
      status(game.name + ' ended');
      $('picked').textContent = game.name + ' ended.';
      $('start').textContent = 'Start again';
      $('start').disabled = false;
      ov.style.display = '';
    },
  };
  try {
    // the runtime reads its own module bytes (emscripten_sig.js)
    Module.wasmBinary = await (await fetch('runMidlet.wasm' + V)).arrayBuffer();
    await loadScript('midp-files.js' + V);
    await loadScript('runMidlet.js' + V);
  } catch (e) {
    status(e.message);
  }
});
</script>
</body>
</html>
