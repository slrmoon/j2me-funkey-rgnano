# FunKey J2ME settings. Remove the "#" in front of a line to change it.
# Environment variables of the same name win over this file.

# window size: the 240x240 screen times SCALE (1..8)
#SCALE = 3

# screen size the game sees (default: runtime default; DoJa: the .jam DrawArea)
#LCD = 240x320

# how the game picture fills the window: fit | integer | crop | fill | center | zoom | auto
#MODE = fit

# scaling filter: sharp | smooth | pixel
#FILTER = sharp

# frame limit
#FPS = 30

# Java heap in MB (default 16, DoJa 32)
#HEAP_MB = 16

# 1 = no sound
#MUTE = 0

# 1 = check bytecode like a phone does (off by default: modded games often
# fail the check but run fine)
#VERIFY = 0

# extra VM options, e.g. -int (interpreter only, no JIT)
#VMARGS =

# 1 = show the runtime console instead of writing data\logs\<game>.log
#CONSOLE = 0
