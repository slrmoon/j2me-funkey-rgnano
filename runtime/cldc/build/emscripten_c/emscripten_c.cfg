#
# Build configuration for emscripten_c: the VM as WebAssembly (Emscripten,
# emcc/em++), with the C interpreter (no JIT, no assembler). romgen and the
# other host tools are 32-bit Linux programs, also with the C interpreter.
# Timer ticks come from the interpreter polling the clock
# (os_emscripten_poll_ticks in os/linux/OS_linux.cpp).
#
host_os   = linux
host_arch = i386
os_family = linux
compiler  = gcc
arch      = c

export ENABLE_C_INTERPRETER             := true
export ENABLE_C_INTERPRETER__BY         := emscripten_c.cfg
export ENABLE_INTERPRETER_GENERATOR     := false
export ENABLE_INTERPRETER_GENERATOR__BY := emscripten_c.cfg
export ENABLE_COMPILER                  := false
export ENABLE_COMPILER__BY              := emscripten_c.cfg

LOOP_GEN_FLAGS = +GenerateGNUCode
ROM_GEN_FLAGS  = +GenerateGNUCode

ifeq ($(IsTarget),true)
    # WebAssembly target
    export TARGET_TOOLCHAIN := emscripten
    target_arch = wasm32
    ifndef ENABLE_TIMER_THREAD
    export ENABLE_TIMER_THREAD     := false
    export ENABLE_TIMER_THREAD__BY := emscripten_c.cfg
    endif
    LINK_FLAGS += -sALLOW_MEMORY_GROWTH=1 -sINITIAL_MEMORY=64MB $(EMSCRIPTEN_LINK_FLAGS)
    # real signatures of the wasm table (Interpreter_c.cpp, invoke_native_entry)
    LINK_FLAGS += --pre-js $(JVMWorkSpace)/src/vm/os/linux/emscripten_sig.js
    # wasm-ld has no -M (map file)
    ENABLE_MAP_FILE = false
else
    # host tools: 32-bit Linux
    target_arch = i386
    ifndef ENABLE_TIMER_THREAD
    export ENABLE_TIMER_THREAD     := true
    export ENABLE_TIMER_THREAD__BY := emscripten_c.cfg
    endif
    CPP_DEF_FLAGS += -m32
    LINK_FLAGS    += -m32 -pthread $(HOST_LINK_EXTRA)
    ASM_FLAGS     += --32
endif

ifndef MERGE_SOURCE_FILES
MERGE_SOURCE_FILES  = true
endif
ifndef SOURCE_MERGER_SIZE
SOURCE_MERGER_SIZE  = 35
endif
