#
# Build configuration for mingw_i386: cross build of the Win32/i386 VM
# on a Linux/i386-capable host with the MinGW-w64 toolchain
# (i686-w64-mingw32-gcc). Host tools (romgen, loopgen) are linux/i386.
#

host_os   = linux
host_arch = i386

MINGW_PREFIX ?= i686-w64-mingw32-
export MINGW_PREFIX

# GNU assembler syntax for the interpreter loop and ROM image; Win32 C
# symbols carry a leading underscore.
ifeq ($(IsRomGen),true)
LOOP_GEN_FLAGS = +GenerateGNUCode
else
LOOP_GEN_FLAGS = +GenerateGNUCode +AddExternCUnderscore
endif
ROM_GEN_FLAGS  = +GenerateGNUCode

ifeq ($(IsLoopGen),true)
    os_family = linux
    arch      = i386
    compiler  = gcc
    CPP_DEF_FLAGS += -DCROSS_GENERATOR=1
endif

ifeq ($(IsRomGen),true)
    # Linux host program; its interpreter loop is generated without the
    # Win32 underscore (see LOOP_GEN_FLAGS above).
    os_family = linux
    arch      = i386
    compiler  = gcc
    CPP_DEF_FLAGS += -DCROSS_GENERATOR=1
endif

ifeq ($(IsTarget),true)
    os_family = win32
    arch      = i386
    compiler  = gcc
    ifndef ENABLE_ROM_GENERATOR
    export ENABLE_ROM_GENERATOR             = false
    export ENABLE_ROM_GENERATOR__BY         = mingw_i386.cfg
    endif
    ifndef ENABLE_TIMER_THREAD
    export ENABLE_TIMER_THREAD     = true
    export ENABLE_TIMER_THREAD__BY = mingw_i386.cfg
    endif
endif

# Link flags: host tools are 32-bit Linux programs (HOST_LINK_EXTRA can add
# e.g. an fmod shim object); the target is a static Win32 executable.
ifeq ($(IsTarget),true)
    LINK_FLAGS += -static -static-libgcc -static-libstdc++ -lws2_32 -lwinmm
else
    CPP_DEF_FLAGS += -m32
    LINK_FLAGS += -m32 -pthread $(HOST_LINK_EXTRA)
    ASM_FLAGS  += --32
endif

ifndef MERGE_SOURCE_FILES
MERGE_SOURCE_FILES  = true
endif
ifndef SOURCE_MERGER_SIZE
SOURCE_MERGER_SIZE  = 35
endif

export BUILD_ANI_LIB := true
